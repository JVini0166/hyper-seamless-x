[package]
name = "windows-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
protocol = { path = "../../packages/protocol" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
if-addrs = "0.15"
mdns-sd = "0.22"
mini-nvcodec = "=0.1.0"
libloading = "0.8"
ureq = { version = "3", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[build-dependencies]
cc = "1"
