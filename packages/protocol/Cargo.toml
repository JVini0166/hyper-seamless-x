[package]
name = "protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
getrandom = "0.3"
rcgen = "0.14"
url = "2"
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
str0m = { version = "0.26.0", default-features = false, features = ["rust-crypto"] }

[[test]]
name = "wire"
path = "../../tests/wire.rs"
